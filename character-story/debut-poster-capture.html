<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>角色登场视频封面</title><style>body{margin:24px;background:#F9F8F6;color:#1c1c1c;font:14px/1.625 sans-serif}video{display:none}img{max-width:90vw;max-height:80vh;object-fit:contain}</style></head><body><p id="status">正在读取视频帧</p><video src="./media/characters/character-debut.mp4" muted playsinline preload="auto"></video><img id="poster" alt="角色登场视频封面"><script>const video=document.querySelector('video');video.addEventListener('loadedmetadata',()=>{video.currentTime=Math.min(2,video.duration/4)});video.addEventListener('seeked',()=>{const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);document.getElementById('poster').src=canvas.toDataURL('image/jpeg',.92);document.getElementById('status').textContent=`封面已生成：${video.videoWidth}×${video.videoHeight}，第${video.currentTime}秒`;});video.addEventListener('error',()=>document.getElementById('status').textContent='视频读取失败');</script></body></html>
